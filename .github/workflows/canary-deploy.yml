name: Canary Deploy

on:
  workflow_dispatch:
    inputs:
      error_budget_override:
        description: 'Set true only for approved emergency override'
        type: boolean
        default: false
        required: true
      override_reason:
        description: 'Required if override is true'
        type: string
        required: false
      override_approver:
        description: 'Required if override is true'
        type: string
        required: false
  workflow_run:
    workflows:
      - Preprod Release Gate
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: canary-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  canary-deploy:
    name: canary-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    env:
      CANARY_BASE_URL: ${{ secrets.CANARY_BASE_URL }}
      CANARY_DEPLOY_COMMAND: ${{ secrets.CANARY_DEPLOY_COMMAND }}
      CANARY_ROLLBACK_COMMAND: ${{ secrets.CANARY_ROLLBACK_COMMAND }}
      PROMETHEUS_BASE_URL: ${{ secrets.PROMETHEUS_BASE_URL }}
      PROMETHEUS_BEARER_TOKEN: ${{ secrets.PROMETHEUS_BEARER_TOKEN }}
      ERROR_BUDGET_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.error_budget_override && 'approved' || '' }}
      ERROR_BUDGET_OVERRIDE_REASON: ${{ github.event_name == 'workflow_dispatch' && inputs.override_reason || '' }}
      ERROR_BUDGET_OVERRIDE_APPROVER: ${{ github.event_name == 'workflow_dispatch' && inputs.override_approver || '' }}
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.value }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build release artifact
        run: npm run build

      - name: Enforce error budget policy
        run: |
          mkdir -p artifacts/reliability
          set -o pipefail
          node ./scripts/reliability/check-error-budget.mjs 2>&1 | tee artifacts/reliability/error-budget-check.log

      - name: Deploy canary slice
        id: deploy_canary
        run: |
          mkdir -p artifacts/canary
          set -o pipefail
          ./scripts/release/deploy-canary.sh 2>&1 | tee artifacts/canary/deploy-canary.log

      - name: Monitor canary SLOs
        id: monitor_canary
        run: |
          mkdir -p artifacts/canary
          set -o pipefail
          node ./scripts/release/monitor-slo.mjs 2>&1 | tee artifacts/canary/monitor-slo.log

      - name: Roll back canary on SLO breach
        if: always() && (steps.deploy_canary.outcome == 'failure' || steps.monitor_canary.outcome == 'failure')
        run: |
          mkdir -p artifacts/canary
          set -o pipefail
          ./scripts/release/rollback-canary.sh 2>&1 | tee artifacts/canary/rollback-canary.log

      - name: Upload canary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-deploy-artifacts
          path: |
            artifacts/canary
            artifacts/reliability
          if-no-files-found: ignore

      - name: Publish summary
        if: always()
        run: |
          echo "## Canary Deploy" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts/reliability/error-budget-check.json ]; then
            echo "- error budget check: recorded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- error budget check: missing" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts/canary/slo-monitor.json ]; then
            echo "- SLO monitor: recorded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- SLO monitor: missing" >> "$GITHUB_STEP_SUMMARY"
          fi
