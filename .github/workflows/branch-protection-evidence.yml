name: Branch Protection Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'

permissions:
  contents: read

jobs:
  branch-protection-snapshot:
    name: branch-protection-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ARTIFACT_SENSITIVITY: restricted-internal
      GOVERNANCE_BRANCH: main
      GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Export branch protection snapshot
        run: node ./scripts/governance/export-branch-protection.mjs

      - name: Upload governance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: branch-protection-main
          path: artifacts/governance/branch-protection-main.json
          retention-days: 30
          if-no-files-found: error
