name: Backend Gates

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint (strict no-warnings)
        run: |
          mkdir -p artifacts/lint
          set -o pipefail
          npm run lint 2>&1 | tee artifacts/lint/lint.log

      - name: Upload lint artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-failure-artifacts
          path: artifacts/lint
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run build
        run: |
          mkdir -p artifacts/build
          set -o pipefail
          npm run build 2>&1 | tee artifacts/build/build.log

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-artifacts
          path: artifacts/build
          if-no-files-found: ignore

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run unit tests
        run: |
          mkdir -p artifacts/unit
          set -o pipefail
          npm run test:unit 2>&1 | tee artifacts/unit/unit.log

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-failure-artifacts
          path: artifacts/unit
          if-no-files-found: ignore

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run contract checks
        run: |
          mkdir -p artifacts/contracts
          set -o pipefail
          npm run contracts:check 2>&1 | tee artifacts/contracts/contracts.log

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-failure-artifacts
          path: artifacts/contracts
          if-no-files-found: ignore

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrobridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrobridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run integration tests
        run: |
          mkdir -p artifacts/integration
          set -o pipefail
          npm run test:integration 2>&1 | tee artifacts/integration/integration.log

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-failure-artifacts
          path: artifacts/integration
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrobridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrobridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agrobridge
      JWT_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      COOKIE_SECRET: yyyyyyyyyyyyyyyy
      STRIPE_SECRET_KEY: sk_test_x
      STRIPE_WEBHOOK_SECRET: whsec_x
      STRIPE_API_VERSION: 2024-06-20
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Prepare database schema
        run: npx prisma db push

      - name: Run e2e tests
        run: |
          mkdir -p artifacts/e2e
          set -o pipefail
          npm run test:e2e 2>&1 | tee artifacts/e2e/e2e.log

      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            artifacts/e2e
          if-no-files-found: ignore

  frontend-compat:
    name: frontend-compat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [contracts]
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Export backend OpenAPI snapshot
        run: npm run contracts:openapi:export

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: AgroBridge-backup/agrobridge-foundation-web
          ref: main
          path: frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: Run frontend compatibility check against backend branch contracts
        run: |
          mkdir -p artifacts/frontend-compat
          set -o pipefail
          node frontend/scripts/contracts/check-backend-contract.mjs 2>&1 | tee artifacts/frontend-compat/frontend-compat.log
        env:
          BACKEND_OPENAPI_FILE: contracts/openapi/openapi.v1.snapshot.json
          BACKEND_DONATION_SCHEMA_FILE: contracts/schemas/post-api-donations-intent.response.v1.ts
          BACKEND_CONTACT_SCHEMA_FILE: contracts/schemas/post-api-contacts.response.v1.ts
          CONTRACT_ARTIFACT_DIR: artifacts/frontend-compat

      - name: Upload frontend compatibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-compat-artifacts
          path: artifacts/frontend-compat
          if-no-files-found: ignore

  release-report:
    name: release-report
    runs-on: ubuntu-latest
    needs: [lint, build, unit, contracts, integration, e2e, frontend-compat]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate release report
        env:
          GATE_LINT: ${{ needs.lint.result }}
          GATE_BUILD: ${{ needs.build.result }}
          GATE_UNIT: ${{ needs.unit.result }}
          GATE_CONTRACTS: ${{ needs.contracts.result }}
          GATE_INTEGRATION: ${{ needs.integration.result }}
          GATE_E2E: ${{ needs.e2e.result }}
          GATE_FRONTEND_COMPAT: ${{ needs.frontend-compat.result }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p artifacts/release
          npm run report:release
          cat artifacts/release/release-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-readiness-artifacts
          path: artifacts/release
          if-no-files-found: ignore

  nightly-tier3:
    name: nightly-tier3
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agrobridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agrobridge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/agrobridge
      JWT_SECRET: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      COOKIE_SECRET: yyyyyyyyyyyyyyyy
      STRIPE_SECRET_KEY: sk_test_x
      STRIPE_WEBHOOK_SECRET: whsec_x
      STRIPE_API_VERSION: 2024-06-20
      CORS_ORIGIN: http://localhost:3000
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tier3 nightly suites
        run: |
          mkdir -p artifacts/tier3
          set -o pipefail
          npm run test:tier3:nightly 2>&1 | tee artifacts/tier3/tier3-nightly.log

      - name: Upload tier3 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier3-nightly-artifacts
          path: artifacts/tier3
          if-no-files-found: ignore
