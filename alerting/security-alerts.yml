# Security Alerting Configuration
# AgroBridge Foundation - Threat Detection Alerts

# Alert Groups
groups:
  - name: security_alerts
    interval: 30s
    rules:
      # Critical Threat Alert
      - alert: CriticalSecurityThreat
        expr: |
          (
            sum by (type) (increase(security_threat_detection_total{severity="critical"}[5m])) > 0
          )
        for: 0m
        labels:
          severity: critical
          team: security
          channel: pagerduty
        annotations:
          summary: "Critical security threat detected"
          description: "{{ $value }} critical threats of type {{ $labels.type }} detected in the last 5 minutes"
          runbook_url: "https://wiki.agrobridge.foundation/security/runbooks/critical-threat"
          dashboard: "https://grafana.agrobridge.foundation/d/security-dashboard"

      # Brute Force Attack Alert
      - alert: BruteForceAttack
        expr: |
          (
            sum by (source_ip) (increase(security_threat_detection_total{type="brute_force"}[5m])) > 10
          )
        for: 2m
        labels:
          severity: high
          team: security
          channel: slack
        annotations:
          summary: "Brute force attack detected"
          description: "IP {{ $labels.source_ip }} has triggered {{ $value }} brute force detection events"
          remediation: "IP has been automatically blocked for 1 hour"

      # SQL Injection Attempt
      - alert: SQLInjectionAttempt
        expr: |
          (
            sum by (source_ip) (increase(security_threat_detection_total{type="sql_injection"}[5m])) > 0
          )
        for: 0m
        labels:
          severity: critical
          team: security
          channel: pagerduty
        annotations:
          summary: "SQL injection attempt detected"
          description: "SQL injection attack detected from IP {{ $labels.source_ip }}"
          action_required: "Review logs immediately and verify database integrity"

      # XSS Attack Detected
      - alert: XSSAttackDetected
        expr: |
          (
            sum by (source_ip) (increase(security_threat_detection_total{type="xss_attempt"}[5m])) > 0
          )
        for: 0m
        labels:
          severity: high
          team: security
          channel: slack
        annotations:
          summary: "XSS attack attempt detected"
          description: "Cross-site scripting attempt from {{ $labels.source_ip }}"

      # Rate Limit Evasion
      - alert: RateLimitEvasion
        expr: |
          (
            sum by (source_ip) (increase(security_threat_detection_total{type="rate_limit_evasion"}[5m])) > 5
          )
        for: 1m
        labels:
          severity: medium
          team: security
          channel: slack
        annotations:
          summary: "Rate limit evasion detected"
          description: "IP {{ $labels.source_ip }} attempting to evade rate limits"

      # Data Exfiltration Alert
      - alert: PotentialDataExfiltration
        expr: |
          (
            sum by (user_id) (increase(security_threat_detection_total{type="data_exfiltration"}[10m])) > 0
          )
        for: 0m
        labels:
          severity: critical
          team: security
          channel: pagerduty
        annotations:
          summary: "Potential data exfiltration detected"
          description: "User {{ $labels.user_id }} triggered data exfiltration detection"
          action_required: "Investigate user activity and check access logs"

      # Account Takeover Attempt
      - alert: AccountTakeoverAttempt
        expr: |
          (
            sum by (user_id) (increase(security_threat_detection_total{type="account_takeover"}[5m])) > 0
          )
        for: 0m
        labels:
          severity: critical
          team: security
          channel: pagerduty
        annotations:
          summary: "Account takeover attempt detected"
          description: "Suspicious activity on account {{ $labels.user_id }}"
          action_required: "Force password reset and notify user"

      # Bot Traffic Spike
      - alert: BotTrafficSpike
        expr: |
          (
            sum(increase(security_threat_detection_total{type="bot_traffic"}[5m])) > 100
          )
        for: 5m
        labels:
          severity: medium
          team: security
          channel: slack
        annotations:
          summary: "High bot traffic detected"
          description: "{{ $value }} bot traffic events in last 5 minutes"
          recommendation: "Consider enabling CAPTCHA for all traffic"

      # Credential Stuffing Attack
      - alert: CredentialStuffingAttack
        expr: |
          (
            sum by (source_ip) (increase(security_threat_detection_total{type="credential_stuffing"}[5m])) > 20
          )
        for: 2m
        labels:
          severity: high
          team: security
          channel: slack
        annotations:
          summary: "Credential stuffing attack in progress"
          description: "{{ $value }} credential stuffing attempts from {{ $labels.source_ip }}"
          remediation: "IP blocked and users notified"

      # High Error Rate from Single IP
      - alert: HighErrorRateFromIP
        expr: |
          (
            sum by (source_ip) (rate(http_requests_total{status=~"4..|5.."}[5m])) > 0.5
          )
        for: 5m
        labels:
          severity: medium
          team: security
          channel: email
        annotations:
          summary: "High error rate from IP"
          description: "IP {{ $labels.source_ip }} generating high error rate"

      # Anomaly Detection Alert
      - alert: SecurityAnomalyDetected
        expr: |
          (
            sum by (type) (increase(anomaly_detected_total{severity=~"high|critical"}[10m])) > 0
          )
        for: 0m
        labels:
          severity: high
          team: security
          channel: slack
        annotations:
          summary: "Security anomaly detected"
          description: "{{ $value }} {{ $labels.type }} anomalies detected"

      # Detection System Health
      - alert: DetectionSystemDown
        expr: |
          (
            up{job="threat-detection"} == 0
          )
        for: 1m
        labels:
          severity: critical
          team: sre
          channel: pagerduty
        annotations:
          summary: "Threat detection system is down"
          description: "Threat detection engine is not responding"

      # Blocked IP Threshold
      - alert: TooManyBlockedIPs
        expr: |
          (
            security_blocked_ips > 100
          )
        for: 10m
        labels:
          severity: warning
          team: security
          channel: slack
        annotations:
          summary: "High number of blocked IPs"
          description: "{{ $value }} IPs currently blocked"
          recommendation: "Review block list and adjust detection thresholds if needed"

      # Alert Queue Backlog
      - alert: AlertQueueBacklog
        expr: |
          (
            security_alert_queue_size > 50
          )
        for: 5m
        labels:
          severity: warning
          team: sre
          channel: slack
        annotations:
          summary: "Security alert queue backlog"
          description: "{{ $value }} alerts pending in queue"

  # Inhibition Rules
  inhibit_rules:
    - source_match:
        severity: critical
      target_match:
        severity: warning
      equal:
        - alertname
        - source_ip

  # Routing Configuration
  route:
    group_by: ['alertname', 'severity', 'type']
    group_wait: 10s
    group_interval: 5m
    repeat_interval: 4h
    receiver: default
    routes:
      - match:
          severity: critical
        receiver: pagerduty
        continue: true
      - match:
          severity: high
        receiver: slack_security
      - match:
          severity: medium
        receiver: email_security
      - match:
          channel: pagerduty
        receiver: pagerduty

  # Receivers
  receivers:
    - name: default
      webhook_configs:
        - url: 'http://localhost:3000/api/webhooks/security-alerts'
          send_resolved: true

    - name: pagerduty
      pagerduty_configs:
        - service_key: '${PAGERDUTY_INTEGRATION_KEY}'
          severity: '{{ .GroupLabels.severity }}'
          description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'

    - name: slack_security
      slack_configs:
        - api_url: '${SLACK_WEBHOOK_URL}'
          channel: '#security-alerts'
          title: 'Security Alert: {{ .GroupLabels.alertname }}'
          text: |
            {{ range .Alerts }}
            *Severity:* {{ .Labels.severity }}
            *Type:* {{ .Labels.type }}
            *Source:* {{ .Labels.source_ip }}
            *Description:* {{ .Annotations.description }}
            {{ end }}
          send_resolved: true

    - name: email_security
      email_configs:
        - to: 'security@agrobridge.foundation'
          from: 'alerts@agrobridge.foundation'
          smarthost: '${SMTP_HOST}:587'
          auth_username: '${SMTP_USER}'
          auth_password: '${SMTP_PASS}'
          headers:
            Subject: 'Security Alert: {{ .GroupLabels.alertname }}'
          html: |
            <h2>Security Alert</h2>
            <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
            <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
            <p><strong>Description:</strong> {{ .CommonAnnotations.description }}</p>

# Alert Templates
templates:
  - name: security.tmpl
    content: |
      {{ define "security.alert.title" }}{{ .GroupLabels.alertname }} - {{ .GroupLabels.severity }}{{ end }}
      {{ define "security.alert.message" }}
      {{ range .Alerts }}
      Alert: {{ .Annotations.summary }}
      Severity: {{ .Labels.severity }}
      Source: {{ .Labels.source_ip }}
      Time: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
      
      {{ .Annotations.description }}
      {{ end }}
      {{ end }}
